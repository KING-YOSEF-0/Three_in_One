<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cozy • bubbly • KING_YOSEF_</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- CSS reset & global ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* floating animation keyframes for main card */
    @keyframes float-card {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    body {
      background: linear-gradient(145deg, #d6ecfa 0%, #c0e0f5 100%);
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* bubbly floating bubbles (background) */
    .bubble-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      background: rgba(220, 245, 255, 0.6);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(180, 225, 255, 0.8);
      animation: float 14s infinite ease-in-out;
      border: 2px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(2px);
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-40px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0) scale(1); opacity: 0.5; }
    }

    /* main card – massive, cozy, bubbly AND floating */
    .app-card {
      position: relative;
      z-index: 10;
      background: rgba(245, 252, 255, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 60px 60px 60px 60px;
      box-shadow: 0 30px 40px -20px rgba(80, 130, 160, 0.3), 
                  inset 0 -4px 10px rgba(255, 255, 255, 0.9),
                  inset 0 6px 12px rgba(230, 250, 255, 0.9);
      padding: 2.5rem 2.2rem 2.8rem;
      max-width: 800px;
      width: 100%;
      border: 3px solid #ffffff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: float-card 4s ease-in-out infinite;
    }

    .app-card:hover {
      box-shadow: 0 35px 50px -20px rgba(80, 130, 160, 0.4), 
                  inset 0 -4px 10px rgba(255, 255, 255, 0.9),
                  inset 0 6px 12px rgba(230, 250, 255, 0.9);
    }

    /* developer badge */
    .dev-badge {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #4a7c9b;
      text-shadow: 3px 3px 0 #d0e8f5, 0 0 15px #e5f4ff;
      margin-bottom: 1.2rem;
      background: rgba(230, 245, 255, 0.8);
      display: inline-block;
      padding: 0.4rem 2rem;
      border-radius: 100px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 0 #a8cce0, 0 6px 12px rgba(80, 130, 160, 0.15);
      transform: rotate(-1deg);
      border: 2px solid #ffffff;
      animation: float-card 5s ease-in-out infinite;
    }

    .dev-badge i {
      color: #6a9fc0;
      margin: 0 6px;
    }

    /* mode buttons – bubbly */
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: #e6f4fc;
      border: none;
      border-radius: 100px;
      padding: 0.9rem 2.2rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: #4a7c9b;
      box-shadow: 0 10px 0 #a8cce0, 0 8px 18px rgba(80, 130, 160, 0.15);
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid #ffffff;
      letter-spacing: 0.5px;
      transform: translateY(-2px);
      position: relative;
      animation: float-card 6s ease-in-out infinite;
    }

    .mode-btn i {
      font-size: 1.5rem;
      color: #6a9fc0;
    }

    /* Button active (pressed) pop effect */
    .pop-active {
      animation: bubble-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    }

    @keyframes bubble-pop {
      0% { transform: scale(1) translateY(-2px); }
      30% { transform: scale(1.15) translateY(-4px); }
      60% { transform: scale(0.95) translateY(2px); }
      100% { transform: scale(1) translateY(-2px); }
    }

    /* TIMER PRESETS ROW */
    .timer-presets {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: #f0f9ff;
      border: 2px solid #ffffff;
      border-radius: 50px;
      padding: 0.5rem 1.2rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #4a7c9b;
      box-shadow: 0 5px 0 #b8d6e8, 0 4px 10px rgba(80, 130, 160, 0.1);
      cursor: pointer;
      transition: all 0.1s ease;
      transform: translateY(-2px);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: float-card 7s ease-in-out infinite;
    }

    .preset-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b8d6e8, 0 4px 10px rgba(80, 130, 160, 0.1);
    }

    .preset-btn.active {
      background: #cce6f7;
      box-shadow: 0 1px 0 #7fb2d0;
      transform: translateY(4px);
      color: #2a5a77;
    }

    .preset-btn i {
      font-size: 0.9rem;
    }

    /* big timer display – floating */
    .timer-display {
      background: #ffffff;
      border-radius: 200px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      box-shadow: inset 0 -10px 20px #d6e8f5, inset 0 10px 20px #ffffff, 
                  0 20px 30px -10px #a8cce0;
      border: 3px solid #ffffff;
      text-align: center;
      transition: all 0.2s;
      animation: float-card 3.5s ease-in-out infinite;
    }

    .time-text {
      font-size: 6.5rem;
      font-weight: 700;
      letter-spacing: 8px;
      color: #2a5a77;
      text-shadow: 6px 6px 0 #d0e8f5, 2px 2px 20px #b8d6e8;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      transition: all 0.2s;
      word-break: break-word;
    }

    /* pomodoro label */
    .pomo-label {
      font-size: 1.4rem;
      font-weight: 600;
      color: #6a9fc0;
      margin-top: 0.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* control buttons */
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin: 1.8rem 0 1rem;
    }

    .ctrl-btn {
      background: #e6f4fc;
      border: none;
      border-radius: 100px;
      width: 80px;
      height: 80px;
      font-size: 2.2rem;
      color: #4a7c9b;
      box-shadow: 0 10px 0 #a8cce0, 0 8px 18px rgba(80, 130, 160, 0.15);
      cursor: pointer;
      transition: all 0.08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      transform: translateY(-2px);
      animation: float-card 8s ease-in-out infinite;
    }

    .ctrl-btn:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #a8cce0, 0 8px 18px rgba(80, 130, 160, 0.15);
    }

    .ctrl-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 6px 0 #b8d6e8;
      pointer-events: none;
      filter: grayscale(0.2);
    }

    /* extra reset & session row */
    .extra-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.8rem;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0 0.3rem;
    }

    .reset-btn, .session-badge {
      background: rgba(230, 245, 255, 0.9);
      border: 2px solid #ffffff;
      border-radius: 60px;
      padding: 0.8rem 1.8rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #4a7c9b;
      box-shadow: 0 6px 0 #a8cce0, 0 6px 12px rgba(80, 130, 160, 0.15);
      cursor: pointer;
      transition: all 0.08s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(-2px);
      animation: float-card 9s ease-in-out infinite;
    }

    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #a8cce0;
    }

    .session-badge {
      background: #d0e8f5;
      color: #2a5a77;
      box-shadow: 0 4px 0 #7fb2d0, 0 6px 12px rgba(80, 130, 160, 0.15);
      cursor: default;
      transform: none;
      font-size: 1.1rem;
      border: 2px solid #ffffff;
      letter-spacing: 0.5px;
    }

    .session-badge i {
      color: #6a9fc0;
      margin-right: 6px;
    }

    /* dev signature bottom */
    .dev-footnote {
      text-align: center;
      margin-top: 2.2rem;
      font-weight: 600;
      color: #6a9fc0;
      font-size: 1.1rem;
      letter-spacing: 1px;
      border-top: 2px dashed #a8cce0;
      padding-top: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      animation: float-card 5.5s ease-in-out infinite;
    }

    .dev-footnote i {
      color: #7fb2d0;
    }

    .dev-footnote span {
      background: #e6f4fc;
      padding: 0.2rem 1.4rem;
      border-radius: 100px;
      font-weight: 700;
      box-shadow: 0 3px 0 #a8cce0;
      color: #2a5a77;
    }

    /* responsive */
    @media (max-width: 600px) {
      .app-card {
        padding: 1.8rem 1.2rem;
        border-radius: 40px;
      }
      .time-text {
        font-size: 4rem;
        letter-spacing: 4px;
      }
      .mode-btn {
        font-size: 1.1rem;
        padding: 0.7rem 1.4rem;
      }
      .ctrl-btn {
        width: 65px;
        height: 65px;
        font-size: 1.8rem;
      }
      .dev-badge {
        font-size: 1rem;
        padding: 0.3rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- bubbly background -->
  <div class="bubble-bg">
    <div class="bubble" style="width: 120px; height: 120px; top: 10%; left: 5%; animation-duration: 18s;"></div>
    <div class="bubble" style="width: 80px; height: 80px; top: 70%; left: 85%; animation-duration: 22s;"></div>
    <div class="bubble" style="width: 200px; height: 200px; top: 60%; left: -5%; animation-duration: 25s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; top: 20%; left: 90%; animation-duration: 12s;"></div>
    <div class="bubble" style="width: 150px; height: 150px; top: 80%; left: 20%; animation-duration: 20s;"></div>
  </div>

  <!-- main app card -->
  <div class="app-card">

    <div style="display: flex; justify-content: center;">
      <div class="dev-badge">
        <i class="fas fa-crown"></i> KING_YOSEF_ <i class="fas fa-code"></i>
      </div>
    </div>

    <!-- Mode tabs: Stopwatch | Timer | Pomodoro -->
    <div class="mode-tabs">
      <button class="mode-btn" data-mode="stopwatch"><i class="fas fa-stopwatch"></i> Stopwatch</button>
      <button class="mode-btn active" data-mode="timer"><i class="fas fa-hourglass-half"></i> Timer</button>
      <button class="mode-btn" data-mode="pomodoro"><i class="fas fa-brain"></i> Pomodoro</button>
    </div>

    <!-- Timer Presets (Only visible in Timer mode) -->
    <div class="timer-presets" id="timerPresets">
      <button class="preset-btn" data-min="5"><i class="fas fa-clock"></i> 5:00</button>
      <button class="preset-btn" data-min="10"><i class="fas fa-clock"></i> 10:00</button>
      <button class="preset-btn" data-min="15"><i class="fas fa-clock"></i> 15:00</button>
      <button class="preset-btn" id="customTimeBtn"><i class="fas fa-pen"></i> Custom</button>
    </div>

    <!-- Timer display -->
    <div class="timer-display">
      <div class="time-text" id="displayTime">05:00</div>
      <div class="pomo-label" id="pomoLabel">timer</div>
    </div>

    <!-- control buttons -->
    <div class="controls">
      <button class="ctrl-btn" id="startPauseBtn"><i class="fas fa-play"></i></button>
      <button class="ctrl-btn" id="resetCtrlBtn"><i class="fas fa-rotate-left"></i></button>
    </div>

    <!-- extra reset + session badge -->
    <div class="extra-row">
      <button class="reset-btn" id="fullResetBtn"><i class="fas fa-arrows-rotate"></i> Reset all</button>
      <div class="session-badge" id="sessionBadge"><i class="fas fa-mug-hot"></i> session: 1</div>
    </div>

    <!-- developer footnote -->
    <div class="dev-footnote">
      <i class="fas fa-heart"></i>
      <span>Developer: KING_YOSEF_</span>
      <i class="fas fa-heart"></i>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    (function(){
      // ----- DOM elements -----
      const displayTime = document.getElementById('displayTime');
      const pomoLabel = document.getElementById('pomoLabel');
      const startPauseBtn = document.getElementById('startPauseBtn');
      const resetCtrlBtn = document.getElementById('resetCtrlBtn');
      const fullResetBtn = document.getElementById('fullResetBtn');
      const sessionBadge = document.getElementById('sessionBadge');
      const timerPresets = document.getElementById('timerPresets');
      const presetBtns = document.querySelectorAll('.preset-btn');
      
      const modeBtns = document.querySelectorAll('.mode-btn');

      // ---- Add Bubble Pop Effect to ALL buttons ----
      const allButtons = document.querySelectorAll('button');
      allButtons.forEach(btn => {
        btn.addEventListener('mousedown', () => {
          btn.classList.add('pop-active');
        });
        btn.addEventListener('mouseup', () => {
          setTimeout(() => btn.classList.remove('pop-active'), 300);
        });
        btn.addEventListener('mouseleave', () => {
          btn.classList.remove('pop-active');
        });
        // For touch devices
        btn.addEventListener('touchstart', () => {
          btn.classList.add('pop-active');
        }, {passive: true});
        btn.addEventListener('touchend', () => {
          setTimeout(() => btn.classList.remove('pop-active'), 300);
        });
      });
      
      // ----- State -----
      let mode = 'timer';        
      
      // stopwatch state
      let swInterval = null;
      let swRunning = false;
      let swStartTime = 0;
      let swElapsed = 0;             

      // timer state
      let timerInterval = null;
      let timerRunning = false;
      let timerDuration = 5 * 60 * 1000; 
      let timerRemaining = timerDuration;
      let timerEndTimestamp = 0;

      // pomodoro state
      let pomoInterval = null;
      let pomoRunning = false;
      let pomoPhase = 'work';        
      let pomoWorkDuration = 25 * 60 * 1000; 
      let pomoBreakDuration = 5 * 60 * 1000; 
      let pomoRemaining = pomoWorkDuration;
      let pomoEndTimestamp = 0;
      let pomoSession = 1;            

      function formatTime(ms, showCentis = true) {
        if (ms < 0) ms = 0;
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        if (showCentis) {
          const centiseconds = Math.floor((ms % 1000) / 10);
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        } else {
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
      }

      function pauseAll() {
        if (swInterval) { clearInterval(swInterval); swInterval = null; }
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        if (pomoInterval) { clearInterval(pomoInterval); pomoInterval = null; }
        swRunning = false;
        timerRunning = false;
        pomoRunning = false;
        updateDisplay();
      }

      function updateDisplay() {
        if (mode === 'timer') {
          timerPresets.style.display = 'flex';
        } else {
          timerPresets.style.display = 'none';
        }

        if (mode === 'stopwatch') {
          displayTime.textContent = formatTime(swElapsed, true);
          pomoLabel.textContent = 'stopwatch';
        } else if (mode === 'timer') {
          displayTime.textContent = formatTime(timerRemaining, false);
          pomoLabel.textContent = 'timer';
        } else if (mode === 'pomodoro') {
          displayTime.textContent = formatTime(pomoRemaining, false);
          pomoLabel.textContent = pomoPhase === 'work' ? '🍅 work' : '☕ break';
        }

        const isRunning = (mode === 'stopwatch' && swRunning) || 
                          (mode === 'timer' && timerRunning) || 
                          (mode === 'pomodoro' && pomoRunning);
        startPauseBtn.innerHTML = isRunning ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
        
        sessionBadge.innerHTML = `<i class="fas fa-mug-hot"></i> session: ${pomoSession}`;
      }

      function toggleStartPause() {
        if (mode === 'stopwatch') {
          if (swRunning) {
            pauseAll();
          } else {
            pauseAll();
            swRunning = true;
            swStartTime = Date.now() - swElapsed;
            swInterval = setInterval(() => {
              swElapsed = Date.now() - swStartTime;
              updateDisplay();
            }, 30);
            updateDisplay();
          }
        } 
        else if (mode === 'timer') {
          if (timerRunning) {
            pauseAll();
          } else {
            if (timerRemaining <= 0) {
              timerRemaining = timerDuration;
            }
            pauseAll();
            timerRunning = true;
            timerEndTimestamp = Date.now() + timerRemaining;
            timerInterval = setInterval(() => {
              const now = Date.now();
              const left = timerEndTimestamp - now;
              if (left <= 0) {
                timerRemaining = 0;
                updateDisplay();
                pauseAll();
                displayTime.textContent = formatTime(0, false);
              } else {
                timerRemaining = left;
                updateDisplay();
              }
            }, 100);
            updateDisplay();
          }
        } 
        else if (mode === 'pomodoro') {
          if (pomoRunning) {
            pauseAll();
          } else {
            if (pomoRemaining <= 0) {
              pomoRemaining = (pomoPhase === 'work') ? pomoWorkDuration : pomoBreakDuration;
            }
            pauseAll();
            pomoRunning = true;
            pomoEndTimestamp = Date.now() + pomoRemaining;
            pomoInterval = setInterval(() => {
              const now = Date.now();
              const left = pomoEndTimestamp - now;
              if (left <= 0) {
                pomoRemaining = 0;
                updateDisplay();
                if (pomoPhase === 'work') {
                  pomoSession++;
                  pomoPhase = 'break';
                  pomoRemaining = pomoBreakDuration;
                } else {
                  pomoPhase = 'work';
                  pomoRemaining = pomoWorkDuration;
                }
                pauseAll();
                updateDisplay();
              } else {
                pomoRemaining = left;
                updateDisplay();
              }
            }, 100);
            updateDisplay();
          }
        }
      }

      function resetCurrentMode() {
        pauseAll();
        if (mode === 'stopwatch') {
          swElapsed = 0;
          updateDisplay();
        } else if (mode === 'timer') {
          timerRemaining = timerDuration;
          updateDisplay();
        } else if (mode === 'pomodoro') {
          pomoPhase = 'work';
          pomoRemaining = pomoWorkDuration;
          updateDisplay();
        }
      }

      function fullReset() {
        pauseAll();
        swElapsed = 0;
        timerDuration = 5 * 60 * 1000;
        timerRemaining = timerDuration;
        pomoPhase = 'work';
        pomoRemaining = pomoWorkDuration;
        pomoSession = 1;
        
        presetBtns.forEach(b => b.classList.remove('active'));
        document.querySelector('.preset-btn[data-min="5"]').classList.add('active');
        
        updateDisplay();
      }

      function setMode(newMode) {
        if (mode === newMode) return;
        pauseAll();
        mode = newMode;
        modeBtns.forEach(btn => {
          if (btn.dataset.mode === mode) btn.classList.add('active');
          else btn.classList.remove('active');
        });
        updateDisplay();
      }

      // ----- Event Listeners -----
      modeBtns.forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
      });

      startPauseBtn.addEventListener('click', toggleStartPause);
      resetCtrlBtn.addEventListener('click', resetCurrentMode);
      fullResetBtn.addEventListener('click', fullReset);

      presetBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (btn.id === 'customTimeBtn') {
            const userInput = prompt("Enter minutes for custom timer (e.g., 7):", "7");
            if (userInput !== null && !isNaN(userInput) && userInput > 0) {
              const mins = parseInt(userInput);
              timerDuration = mins * 60 * 1000;
              timerRemaining = timerDuration;
              presetBtns.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              pauseAll();
              updateDisplay();
            }
          } else {
            const mins = parseInt(btn.dataset.min);
            timerDuration = mins * 60 * 1000;
            timerRemaining = timerDuration;
            presetBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            pauseAll();
            updateDisplay();
          }
        });
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !e.target.matches('input, button, textarea')) {
          e.preventDefault();
          toggleStartPause();
        }
      });

      document.querySelector('.preset-btn[data-min="5"]').classList.add('active');
      updateDisplay();
    })();
  </script>
</body>
</html>
